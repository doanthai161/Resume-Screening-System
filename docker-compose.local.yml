# Infrastructure for an API/worker running on the host. Separate project,
# container names and volumes preserve the legacy development database.
name: resume-screening-local

services:
  mongo-key:
    extends:
      file: docker-compose.yml
      service: mongo-key

  mongo:
    extends:
      file: docker-compose.yml
      service: mongo
    container_name: resume_mongo_local
    ports:
      - "127.0.0.1:27019:27017"
    healthcheck:
      # Read credentials inside mongosh, without shell splitting special chars.
      test:
        - CMD
        - mongosh
        - --quiet
        - --norc
        - --eval
        - >-
          const a = db.getSiblingDB("admin");
          a.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD);
          const r = a.runCommand({getCmdLineOpts: 1});
          const opts = r.parsed?.replication;
          quit(r.ok && (opts?.replSetName ?? opts?.replSet) === "rs0" ? 0 : 1);

  mongo-init-replica:
    extends:
      file: docker-compose.yml
      service: mongo-init-replica

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    container_name: resume_redis_local
    ports:
      - "127.0.0.1:6381:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -qx PONG"]

volumes:
  mongo_data:
  mongo_key:
  redis_data:
