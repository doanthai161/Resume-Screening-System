services:
  api:
    build: .
    container_name: resume_screening_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: &backend_environment
      - PROJECT_ROOT_DIR=/app
      - MONGODB_URI=mongodb://${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongo:27017/${MONGO_APP_DATABASE:-resume_screening_db}?authSource=${MONGO_APP_DATABASE:-resume_screening_db}&replicaSet=rs0
      - MONGODB_DB_NAME=${MONGO_APP_DATABASE:-resume_screening_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - REFRESH_COOKIE_SECURE=true
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  worker-parse: &worker_common
    build: .
    profiles: ["workers"]
    env_file: [.env]
    environment: *backend_environment
    command: ["python", "-m", "app.worker", "--queue", "resume-parse"]
    init: true
    stop_grace_period: 150s
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads:ro

  worker-screening:
    <<: *worker_common
    command: ["python", "-m", "app.worker", "--queue", "screening"]

  mongo:
    image: mongo:7
    container_name: resume_mongo_db
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-key/keyfile", "--bind_ip_all"]
    depends_on:
      mongo-key:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-resume_screening_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
      - mongo_key:/etc/mongo-key:ro
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-key:
    image: mongo:7
    user: "0:0"
    entrypoint: ["bash", "-ec"]
    command:
      - "if [ ! -s /key/keyfile ]; then umask 077; openssl rand -base64 756 > /key/keyfile; fi; chown 999:999 /key/keyfile; chmod 400 /key/keyfile"
    volumes:
      - mongo_key:/key

  mongo-init-replica:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    entrypoint: ["mongosh", "--quiet", "--host", "mongo:27017", "/scripts/init-replica.js"]
    volumes:
      - ./scripts/init-replica.js:/scripts/init-replica.js:ro

  redis:
    image: redis:7-alpine
    container_name: resume_redis_db
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  mongo_key:
  redis_data:
